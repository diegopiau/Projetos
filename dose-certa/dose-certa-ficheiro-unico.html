<style>
/* ==========================================================================
   Dose Certa — folha de estilos
   Desenhada para leitura fácil: texto grande, contraste alto, alvos amplos.
   ========================================================================== */

:root {
  --escala: 20px;

  --fundo: #FBF9F5;
  --superficie: #FFFFFF;
  --superficie-2: #F2EEE7;
  --texto: #16191F;
  --texto-suave: #4E5561;
  --linha: #DDD6CA;

  --marca: #0B5E63;
  --marca-clara: #E3F1F1;
  --marca-escura: #073F43;

  --ok: #1B6E3C;
  --ok-claro: #E1F2E7;
  --aviso: #8A5300;
  --aviso-claro: #FBEFD9;
  --erro: #A32218;
  --erro-claro: #FBE6E4;

  --manha: #C2650B;
  --meio: #1B6E3C;
  --tarde: #14548F;
  --noite: #5B3E9B;

  --raio: 14px;
  --toque: 60px;
  --sombra: 0 1px 2px rgba(20,25,35,.06), 0 4px 14px rgba(20,25,35,.06);
}

html[data-tamanho="normal"] { --escala: 18px; }
html[data-tamanho="grande"] { --escala: 20px; }
html[data-tamanho="enorme"] { --escala: 24px; --toque: 68px; }

html[data-contraste="alto"] {
  --fundo: #000000;
  --superficie: #0E0E0E;
  --superficie-2: #1C1C1C;
  --texto: #FFFFFF;
  --texto-suave: #E4E4E4;
  --linha: #6E6E6E;
  --marca: #FFD400;
  --marca-clara: #2A2400;
  --marca-escura: #FFE457;
  --ok: #4FE07A;
  --ok-claro: #06240F;
  --aviso: #FFC03A;
  --aviso-claro: #2A1F00;
  --erro: #FF8B80;
  --erro-claro: #2C0A07;
  --manha: #FFB25C;
  --meio: #4FE07A;
  --tarde: #7EC0FF;
  --noite: #C9A9FF;
  --sombra: none;
}

* { box-sizing: border-box; }

html { font-size: var(--escala); -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 0 0 6rem;
  background: var(--fundo);
  color: var(--texto);
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
}

h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; font-weight: 700; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }

.conteudo { max-width: 46rem; margin: 0 auto; padding: 1rem; }

/* ---------- Cabeçalho ---------------------------------------------------- */

.topo {
  position: sticky; top: 0; z-index: 40;
  background: var(--marca); color: #fff;
  border-bottom: 3px solid var(--marca-escura);
}
html[data-contraste="alto"] .topo { background: #000; color: var(--marca); border-bottom-color: var(--marca); }

.topo__interior {
  max-width: 46rem; margin: 0 auto; padding: .6rem 1rem;
  display: flex; align-items: center; gap: .7rem;
}
.topo__marca { font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; white-space: nowrap; }
.topo__data { margin-left: auto; text-align: right; font-size: .72rem; opacity: .95; min-width: 0; }
.topo__data strong { display: block; font-size: 1rem; font-variant-numeric: tabular-nums; }
.topo__data span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Na letra maior o cabeçalho não chega para a data; ela fica logo abaixo,
   por extenso, no corpo do ecrã. Mais vale escondê-la que cortá-la. */
html[data-tamanho="enorme"] .topo__data span { display: none; }

/* ---------- Navegação inferior ------------------------------------------- */

.navegacao {
  position: fixed; inset: auto 0 0 0; z-index: 50;
  background: var(--superficie);
  border-top: 2px solid var(--linha);
  padding-bottom: env(safe-area-inset-bottom);
}
.navegacao__interior {
  max-width: 46rem; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.aba {
  appearance: none; border: 0; background: none; cursor: pointer;
  min-height: var(--toque); padding: .35rem .1rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
  color: var(--texto-suave); font-size: .68rem; font-weight: 600; font-family: inherit;
  border-top: 4px solid transparent;
}
.aba svg { width: 1.5rem; height: 1.5rem; }
.aba[aria-selected="true"] { color: var(--marca); border-top-color: var(--marca); background: var(--marca-clara); }
.aba:focus-visible { outline: 3px solid var(--marca); outline-offset: -3px; }

/* ---------- Botões -------------------------------------------------------- */

.btn {
  appearance: none; font-family: inherit; font-size: 1rem; font-weight: 700;
  min-height: var(--toque); padding: .7rem 1.1rem;
  border-radius: var(--raio); border: 2px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  cursor: pointer; text-decoration: none; line-height: 1.2;
}
.btn:focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
.btn--principal { background: var(--marca); color: #fff; }
html[data-contraste="alto"] .btn--principal { background: var(--marca); color: #000; }
.btn--tomei { background: var(--ok); color: #fff; flex: 1; font-size: 1.1rem; }
html[data-contraste="alto"] .btn--tomei { background: var(--ok); color: #000; }
.btn--neutro { background: var(--superficie); color: var(--texto); border-color: var(--linha); }
.btn--perigo { background: var(--superficie); color: var(--erro); border-color: var(--erro); }
.btn--largo { width: 100%; }
.btn--pequeno { min-height: 2.6rem; padding: .4rem .8rem; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Cartões ------------------------------------------------------- */

.cartao {
  background: var(--superficie); border: 2px solid var(--linha);
  border-radius: var(--raio); padding: 1rem; margin-bottom: 1rem;
  box-shadow: var(--sombra);
}
.cartao--aviso { border-color: var(--aviso); background: var(--aviso-claro); }
.cartao--erro { border-color: var(--erro); background: var(--erro-claro); }
.cartao--ok { border-color: var(--ok); background: var(--ok-claro); }

/* ---------- Blocos de toma ------------------------------------------------ */

.bloco {
  border: 3px solid var(--linha); border-radius: var(--raio);
  background: var(--superficie); margin-bottom: 1.1rem; overflow: hidden;
  box-shadow: var(--sombra);
}
.bloco[data-periodo="manha"] { border-color: var(--manha); }
.bloco[data-periodo="meio"]  { border-color: var(--meio); }
.bloco[data-periodo="tarde"] { border-color: var(--tarde); }
.bloco[data-periodo="noite"] { border-color: var(--noite); }

.bloco__cabeca {
  display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
  padding: .7rem .9rem; color: #fff; background: var(--texto-suave);
}
html[data-contraste="alto"] .bloco__cabeca { color: #000; }
.bloco[data-periodo="manha"] .bloco__cabeca { background: var(--manha); }
.bloco[data-periodo="meio"]  .bloco__cabeca { background: var(--meio); }
.bloco[data-periodo="tarde"] .bloco__cabeca { background: var(--tarde); }
.bloco[data-periodo="noite"] .bloco__cabeca { background: var(--noite); }

.bloco__hora {
  flex: 0 0 auto; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
.bloco__identidade { flex: 1 1 9rem; min-width: 0; }
.bloco__titulo { font-weight: 700; font-size: .95rem; }
.bloco__sub { font-size: .75rem; opacity: .95; white-space: nowrap; }
.bloco__estado {
  flex: 0 0 auto; margin-left: auto; font-size: .75rem; font-weight: 700;
  text-align: right; white-space: nowrap;
}

.bloco--concluido { opacity: .62; }
.bloco--agora { box-shadow: 0 0 0 5px var(--marca-clara), var(--sombra); }

.bloco__corpo { padding: .3rem 1rem 1rem; }
.bloco__accoes { display: flex; gap: .6rem; flex-wrap: wrap; padding: 0 1rem 1rem; }

/* ---------- Linha de medicamento ------------------------------------------ */

.toma {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: .8rem 0; border-bottom: 1px solid var(--linha);
}
.toma:last-child { border-bottom: 0; }
.toma__caixa {
  flex: 0 0 auto; width: 2.4rem; height: 2.4rem; margin-top: .1rem;
  border: 3px solid var(--linha); border-radius: 8px; background: var(--superficie);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.toma__caixa[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
html[data-contraste="alto"] .toma__caixa[aria-pressed="true"] { color: #000; }
.toma__caixa svg { width: 1.4rem; height: 1.4rem; }
.toma__info { flex: 1; min-width: 0; }
.toma__nome { font-weight: 700; font-size: 1.05rem; }
.toma__dose { color: var(--texto-suave); font-size: .9rem; }
.toma--feita .toma__nome { text-decoration: line-through; }
/* Na caixa semanal "posta" significa colocada no compartimento, não tomada. */
.toma--posta .toma__nome { color: var(--texto-suave); }
.toma--saltada .toma__nome { text-decoration: line-through; color: var(--erro); }

/* ---------- Etiquetas ----------------------------------------------------- */

.etiqueta {
  display: inline-flex; align-items: center; gap: .3rem;
  font-size: .75rem; font-weight: 700; padding: .18rem .55rem;
  border-radius: 999px; border: 2px solid var(--linha); background: var(--superficie-2);
  color: var(--texto); margin: .25rem .3rem 0 0; white-space: nowrap;
}
.etiqueta--caixa { border-color: var(--tarde); color: var(--tarde); background: transparent; }
.etiqueta--embalagem { border-color: var(--manha); color: var(--manha); background: transparent; }
.etiqueta--jejum { border-color: var(--erro); color: var(--erro); background: transparent; }
.etiqueta--aviso { border-color: var(--aviso); color: var(--aviso); background: transparent; }

/* ---------- Formulários --------------------------------------------------- */

.campo { margin-bottom: 1rem; }
.campo > label, .grupo__legenda {
  display: block; font-weight: 700; margin-bottom: .35rem; font-size: .95rem;
}
.campo__ajuda { font-size: .8rem; color: var(--texto-suave); margin: .25rem 0 0; }

input[type="text"], input[type="number"], input[type="time"], input[type="date"],
input[type="tel"], select, textarea {
  width: 100%; font-family: inherit; font-size: 1rem; color: var(--texto);
  background: var(--superficie); border: 2px solid var(--linha);
  border-radius: 10px; padding: .7rem .8rem; min-height: 3rem;
}
input:focus, select:focus, textarea:focus { outline: 3px solid var(--marca); outline-offset: 1px; border-color: var(--marca); }
textarea { min-height: 5rem; resize: vertical; }
fieldset { border: 2px solid var(--linha); border-radius: var(--raio); padding: .8rem; margin: 0 0 1rem; }
legend { font-weight: 700; padding: 0 .4rem; }

.opcoes { display: grid; gap: .5rem; }
.opcao {
  display: flex; align-items: flex-start; gap: .7rem; padding: .7rem;
  border: 2px solid var(--linha); border-radius: 10px; cursor: pointer; background: var(--superficie);
}
.opcao:has(input:checked) { border-color: var(--marca); background: var(--marca-clara); }
.opcao input { width: 1.4rem; height: 1.4rem; margin-top: .1rem; flex: 0 0 auto; accent-color: var(--marca); }
.opcao__texto { font-weight: 600; }
.opcao__nota { display: block; font-weight: 400; font-size: .82rem; color: var(--texto-suave); }

.linha-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
@media (max-width: 30rem) { .linha-2 { grid-template-columns: 1fr; } }

.horas-lista { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.horas-lista input[type="time"] { width: auto; min-width: 8.5rem; }

.dias { display: flex; flex-wrap: wrap; gap: .4rem; }
.dia {
  border: 2px solid var(--linha); border-radius: 10px; background: var(--superficie);
  padding: .5rem .7rem; font-weight: 700; cursor: pointer; font-family: inherit; font-size: .9rem;
  min-width: 3rem; min-height: 3rem;
}
.dia[aria-pressed="true"] { background: var(--marca); color: #fff; border-color: var(--marca); }
html[data-contraste="alto"] .dia[aria-pressed="true"] { color: #000; }

/* ---------- Caixa semanal ------------------------------------------------- */

.grelha-caixa { overflow-x: auto; }
.grelha-caixa table { border-collapse: collapse; width: 100%; min-width: 34rem; }
.grelha-caixa th, .grelha-caixa td {
  border: 2px solid var(--linha); padding: .5rem; text-align: center; font-size: .85rem;
}
.grelha-caixa th { background: var(--superficie-2); font-weight: 700; }
.grelha-caixa td:first-child, .grelha-caixa th:first-child { text-align: left; min-width: 11rem; }
.marca-caixa { font-weight: 800; font-size: 1.05rem; }

/* ---------- Diversos ------------------------------------------------------ */

.vazio { text-align: center; color: var(--texto-suave); padding: 2.5rem 1rem; }
.vazio svg { width: 4rem; height: 4rem; opacity: .35; margin-bottom: .5rem; }

.barra { height: 1.5rem; background: var(--superficie-2); border-radius: 999px; overflow: hidden; border: 2px solid var(--linha); }
.barra__parte { height: 100%; background: var(--ok); }

.estatisticas { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; }
.estatistica { text-align: center; padding: .8rem .4rem; border: 2px solid var(--linha); border-radius: var(--raio); background: var(--superficie); }
.estatistica__valor { font-size: 1.7rem; font-weight: 800; line-height: 1; }
.estatistica__rotulo { font-size: .75rem; color: var(--texto-suave); font-weight: 600; }

.oculto { display: none !important; }
.so-leitor {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Janela modal --------------------------------------------------- */

dialog.modal {
  width: min(42rem, 94vw); max-height: 90vh; padding: 0;
  border: 3px solid var(--marca); border-radius: var(--raio);
  background: var(--fundo); color: var(--texto);
}
dialog.modal::backdrop { background: rgba(0,0,0,.6); }
.modal__cabeca {
  position: sticky; top: 0; background: var(--marca); color: #fff;
  padding: .8rem 1rem; display: flex; align-items: center; gap: .6rem;
}
html[data-contraste="alto"] .modal__cabeca { background: #000; color: var(--marca); border-bottom: 2px solid var(--marca); }
.modal__cabeca h2 { margin: 0; font-size: 1.15rem; }
.modal__fechar {
  margin-left: auto; background: none; border: 2px solid currentColor; color: inherit;
  border-radius: 8px; width: 2.6rem; height: 2.6rem; cursor: pointer; font-size: 1.2rem; font-family: inherit;
}
.modal__corpo { padding: 1rem; overflow-y: auto; }
.modal__rodape {
  position: sticky; bottom: 0; background: var(--fundo); border-top: 2px solid var(--linha);
  padding: .8rem 1rem; display: flex; gap: .6rem; flex-wrap: wrap;
}

/* ---------- Alerta em ecrã inteiro ---------------------------------------- */

.alarme {
  position: fixed; inset: 0; z-index: 100; background: var(--marca);
  color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 2rem 1.2rem; gap: 1rem;
}
html[data-contraste="alto"] .alarme { background: #000; color: var(--marca); }
.alarme__hora { font-size: 3.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.alarme__titulo { font-size: 1.5rem; font-weight: 700; }
.alarme__lista { list-style: none; padding: 0; margin: .5rem 0; font-size: 1.15rem; font-weight: 600; }
.alarme__lista li { margin: .3rem 0; }
.alarme__accoes { display: flex; flex-direction: column; gap: .7rem; width: min(22rem, 100%); }
.alarme__accoes .btn { width: 100%; }

/* ---------- Aviso ligeiro (toast) ----------------------------------------- */

.aviso-flutuante {
  position: fixed; left: 50%; bottom: calc(var(--toque) + 1.4rem); transform: translateX(-50%);
  z-index: 90; background: var(--texto); color: var(--fundo);
  padding: .8rem 1.2rem; border-radius: 999px; font-weight: 700; font-size: .9rem;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; text-align: center;
}
html[data-contraste="alto"] .aviso-flutuante { border: 2px solid var(--marca); }

/* ---------- Impressão ------------------------------------------------------ */

@media print {
  .topo, .navegacao, .btn, .sem-impressao { display: none !important; }
  body { background: #fff; color: #000; padding: 0; font-size: 12pt; }
  .cartao, .bloco { break-inside: avoid; box-shadow: none; border-color: #000; }
  .grelha-caixa table { min-width: 0; }
  .grelha-caixa th, .grelha-caixa td { border-color: #000; }
}

@media (prefers-reduced-motion: no-preference) {
  .bloco--agora { animation: pulsar 2.4s ease-in-out infinite; }
  @keyframes pulsar {
    0%, 100% { box-shadow: 0 0 0 5px var(--marca-clara), var(--sombra); }
    50%      { box-shadow: 0 0 0 10px var(--marca-clara), var(--sombra); }
  }
}

/* ---------- Caixa semanal: grelha em ecrã largo, cartões por dia no telemóvel */

.caixa-dias { display: grid; gap: 0; }

@media (min-width: 48rem) {
  .caixa-dias { display: none; }
}
@media (max-width: 47.99rem) {
  .grelha-caixa { display: none; }
}
@media print {
  .caixa-dias { display: none !important; }
  .grelha-caixa { display: block !important; }
}

</style>

<script>
(function () {
'use strict';

/* ===== js/dados.js ===== */

   dados.js — modelo, persistência local e utilitários de data

   ========================================================================== */

const CHAVE = 'dose-certa.v1';

// A aplicação chamou-se «A Horas» antes de passar a «Dose Certa». Quem já tinha
// dados sob a chave antiga não os deve perder na mudança de nome.
const CHAVE_ANTERIOR = 'a-horas.v1';

const DIAS_CURTOS = ['Dom', '2ª', '3ª', '4ª', '5ª', '6ª', 'Sáb'];
const DIAS_LONGOS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira',
                            'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho',
                      'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MESES_CURTOS = ['jan.', 'fev.', 'mar.', 'abr.', 'mai.', 'jun.',
                             'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];

const FORMAS = [
  { id: 'comprimido', rotulo: 'Comprimido' },
  { id: 'capsula', rotulo: 'Cápsula' },

/* -------------------------------------------------------------------------

   ------------------------------------------------------------------------- */

const estado = {
  config: configPorOmissao(),
  medicamentos: [],
  registos: {},      // { 'AAAA-MM-DD': { 'idMed@HH:MM': { estado, hora, unidades } } }
  preparacoes: {},   // { 'AAAA-MM-DD': { idMed: true } }  — caixa semanal já enchida
};

const ouvintes = new Set();

function aoMudar(fn) { ouvintes.add(fn); return () => ouvintes.delete(fn); }

function notificar() { ouvintes.forEach((fn) => fn()); }

function guardar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify({
      versao: 1,
      config: estado.config,
      medicamentos: estado.medicamentos,
      registos: estado.registos,
      preparacoes: estado.preparacoes,
    }));
  } catch (erro) {
    console.error('Não foi possível guardar os dados', erro);
    alert('Não foi possível guardar os dados neste dispositivo. '
        + 'Verifique se o armazenamento do navegador está disponível.');
  }
  notificar();
}

/** Move os dados da chave antiga para a actual, uma única vez. */
function migrarChaveAnterior() {
  try {
    if (localStorage.getItem(CHAVE) !== null) return;
    const antigo = localStorage.getItem(CHAVE_ANTERIOR);
    if (antigo === null) return;
    localStorage.setItem(CHAVE, antigo);
    localStorage.removeItem(CHAVE_ANTERIOR);
  } catch { /* sem armazenamento não há nada a migrar */ }
}

function carregar() {
  try {
    migrarChaveAnterior();
    const bruto = localStorage.getItem(CHAVE);
    if (!bruto) return false;
    const dados = JSON.parse(bruto);
    estado.config = { ...configPorOmissao(), ...(dados.config || {}) };
    estado.config.refeicoes = { ...configPorOmissao().refeicoes, ...(dados.config?.refeicoes || {}) };
    estado.config.cuidador = { ...configPorOmissao().cuidador, ...(dados.config?.cuidador || {}) };
    estado.medicamentos = Array.isArray(dados.medicamentos) ? dados.medicamentos : [];
    estado.registos = dados.registos || {};
    estado.preparacoes = dados.preparacoes || {};
    return true;
  } catch (erro) {
    console.error('Dados guardados ilegíveis', erro);
    return false;
  }
}

function importar(dados) {
  if (!dados || typeof dados !== 'object' || !Array.isArray(dados.medicamentos)) {
    throw new Error('Ficheiro inválido: não parece uma cópia de segurança da Dose Certa.');
  }
  estado.config = { ...configPorOmissao(), ...(dados.config || {}) };
  estado.config.refeicoes = { ...configPorOmissao().refeicoes, ...(dados.config?.refeicoes || {}) };
  estado.config.cuidador = { ...configPorOmissao().cuidador, ...(dados.config?.cuidador || {}) };
  estado.medicamentos = dados.medicamentos;
  estado.registos = dados.registos || {};
  estado.preparacoes = dados.preparacoes || {};
  guardar();
}

function exportar() {
  return {
    aplicacao: 'Dose Certa',
    versao: 1,
    exportadoEm: new Date().toISOString(),
    config: estado.config,
    medicamentos: estado.medicamentos,
    registos: estado.registos,
    preparacoes: estado.preparacoes,
  };
}

function apagarTudo() {
  localStorage.removeItem(CHAVE);
  localStorage.removeItem(CHAVE_ANTERIOR);
  estado.config = configPorOmissao();
  estado.medicamentos = [];
  estado.registos = {};
  estado.preparacoes = {};
  notificar();
}

function obterMedicamento(id) {

}

function gravarMedicamento(med) {

  if (indice >= 0) estado.medicamentos[indice] = med;
  else estado.medicamentos.push(med);

/* -------------------------------------------------------------------------
   Registos de tomas
   ------------------------------------------------------------------------- */

function chaveToma(idMed, hora) { return `${idMed}@${hora}`; }

function obterRegisto(dataISO, idMed, hora) {
  return estado.registos[dataISO]?.[chaveToma(idMed, hora)] || null;
}

/**
 * Marca uma toma. `situacao` é 'tomada', 'saltada' ou null (repõe por marcar).
 * Ao confirmar uma toma, desconta o stock; ao desmarcar, devolve-o.
 */
function marcarToma(dataISO, idMed, hora, situacao) {
  const med = obterMedicamento(idMed);
  if (!med) return;
  if (!estado.registos[dataISO]) estado.registos[dataISO] = {};
  const dia = estado.registos[dataISO];
  const chave = chaveToma(idMed, hora);
  const anterior = dia[chave];

  // Devolve stock se a toma anterior o tinha descontado.
  if (anterior?.estado === 'tomada' && typeof anterior.unidades === 'number'
      && typeof med.stock?.unidades === 'number') {
    med.stock.unidades = Math.round((med.stock.unidades + anterior.unidades) * 100) / 100;
  }

  if (!situacao) {
    delete dia[chave];
  } else {
    const registo = { estado: situacao, hora: new Date().toISOString() };
    if (situacao === 'tomada' && typeof med.stock?.unidades === 'number') {
      const gasto = Number(med.quantidadePorToma) || 0;
      med.stock.unidades = Math.round(Math.max(0, med.stock.unidades - gasto) * 100) / 100;
      registo.unidades = gasto;
    }
    dia[chave] = registo;
  }
  if (Object.keys(dia).length === 0) delete estado.registos[dataISO];
  guardar();
}

function marcarPreparacao(dataISO, idMed, preparado) {
  if (!estado.preparacoes[dataISO]) estado.preparacoes[dataISO] = {};
  if (preparado) estado.preparacoes[dataISO][idMed] = true;
  else delete estado.preparacoes[dataISO][idMed];
  if (Object.keys(estado.preparacoes[dataISO]).length === 0) delete estado.preparacoes[dataISO];
  guardar();
}

/* -------------------------------------------------------------------------
   Datas — sempre em hora local, nunca UTC (evita saltos de dia)
   ------------------------------------------------------------------------- */

function paraISO(data) {
  const a = data.getFullYear();
  const m = String(data.getMonth() + 1).padStart(2, '0');
  const d = String(data.getDate()).padStart(2, '0');
  return `${a}-${m}-${d}`;
}

function deISO(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d);
}

function hojeISO() { return paraISO(new Date()); }

function somarDias(iso, n) {
  const data = deISO(iso);
  data.setDate(data.getDate() + n);
  return paraISO(data);
}

function diferencaDias(isoA, isoB) {
  return Math.round((deISO(isoB) - deISO(isoA)) / 86400000);
}

/** Forma curta, para o cabeçalho: «6ª, 28 ago.». A longa fica no corpo do ecrã. */
function dataCurta(iso) {
  const d = deISO(iso);
  return `${DIAS_CURTOS[d.getDay()]}, ${d.getDate()} ${MESES_CURTOS[d.getMonth()]}`;
}

function dataPorExtenso(iso) {
  const d = deISO(iso);
  return `${DIAS_LONGOS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
}

function minutosDeHora(hhmm) {
  const [h, m] = String(hhmm).split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function horaDeMinutos(minutos) {
  const total = ((Math.round(minutos) % 1440) + 1440) % 1440;
  const h = String(Math.floor(total / 60)).padStart(2, '0');
  const m = String(total % 60).padStart(2, '0');
  return `${h}:${m}`;
}

function minutosAgora() {
  const agora = new Date();
  return agora.getHours() * 60 + agora.getMinutes();
}

/** Cria um elemento. `props.texto` escreve texto seguro; nunca usamos innerHTML com dados. */
function el(etiqueta, props = {}, filhos = []) {
  const nodo = document.createElement(etiqueta);
  Object.entries(props).forEach(([chave, valor]) => {
    if (valor === null || valor === undefined || valor === false) return;
    if (chave === 'texto') nodo.textContent = valor;
    else if (chave === 'classe') nodo.className = valor;
    else if (chave === 'ao') Object.entries(valor).forEach(([ev, fn]) => nodo.addEventListener(ev, fn));
    else if (chave === 'dados') Object.entries(valor).forEach(([d, v]) => { nodo.dataset[d] = v; });
    else if (chave in nodo && chave !== 'list') nodo[chave] = valor;
    else nodo.setAttribute(chave, valor);
  });
  (Array.isArray(filhos) ? filhos : [filhos]).forEach((filho) => {
    if (filho === null || filho === undefined || filho === false) return;
    nodo.append(filho.nodeType ? filho : document.createTextNode(String(filho)));
  });
  return nodo;
}

function limpar(nodo) { while (nodo.firstChild) nodo.firstChild.remove(); }

/* -------------------------------------------------------------------------
   Janela modal reutilizável
   ------------------------------------------------------------------------- */

function abrirModal({ titulo, corpo, accoes = [], aoFechar }) {
  document.querySelector('dialog.modal')?.remove();

  const janela = el('dialog', { classe: 'modal', 'aria-label': titulo });
  const fechar = () => { janela.close(); };

  const cabeca = el('div', { classe: 'modal__cabeca' }, [
    el('h2', { texto: titulo }),
    el('button', { classe: 'modal__fechar', type: 'button', 'aria-label': 'Fechar',
                   ao: { click: fechar } }, [icone('cruz', '1.3rem')]),
  ]);

  const corpoNodo = el('div', { classe: 'modal__corpo' }, [corpo]);
  const rodape = accoes.length
    ? el('div', { classe: 'modal__rodape' }, accoes.map((accao) => el('button', {
        classe: `btn ${accao.classe || 'btn--neutro'}${accao.largo ? ' btn--largo' : ''}`,
        type: 'button',
        texto: accao.rotulo,
        ao: { click: () => accao.aoClicar?.(fechar) },
      })))
    : null;

  janela.append(cabeca, corpoNodo, rodape || document.createComment(''));
  janela.addEventListener('close', () => { janela.remove(); aoFechar?.(); });
  document.body.append(janela);
  janela.showModal();
  return { janela, fechar };
}

function confirmar({ titulo, mensagem, rotuloConfirmar = 'Confirmar', perigo = false }) {
  return new Promise((resolve) => {
    let decidido = false;
    abrirModal({
      titulo,
      corpo: el('p', { texto: mensagem, style: 'font-size:1.05rem' }),
      accoes: [
        { rotulo: 'Cancelar', classe: 'btn--neutro', aoClicar: (fechar) => { fechar(); } },
        { rotulo: rotuloConfirmar, classe: perigo ? 'btn--perigo' : 'btn--principal',
          aoClicar: (fechar) => { decidido = true; fechar(); } },
      ],
      aoFechar: () => resolve(decidido),
    });
  });
}

   ------------------------------------------------------------------------- */

function descarregar(nomeFicheiro, conteudo, tipo = 'text/plain;charset=utf-8') {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const ligacao = el('a', { href: url, download: nomeFicheiro });
  document.body.append(ligacao);
  ligacao.click();
  ligacao.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

   horarios.js — transforma posologias em horas concretas e agrupa-as em blocos
   ========================================================================== */



/* -------------------------------------------------------------------------
   Que horas tem este medicamento neste dia?
   ------------------------------------------------------------------------- */

function activoNoDia(med, dataISO) {
  if (!med.activo) return false;
  if (med.inicio && dataISO < med.inicio) return false;
  if (med.fim && dataISO > med.fim) return false;

  const r = med.regime || {};
  if (r.tipo === 'sos') return false;              // só a pedido, não entra na rotina

  const diaSemana = deISO(dataISO).getDay();
  if (r.tipo === 'semanal') {
    return Array.isArray(r.diasSemana) && r.diasSemana.includes(diaSemana);
  }
  if (r.tipo === 'ciclo') {
    const n = Math.max(1, Number(r.cadaNDias) || 1);
    const base = med.inicio || dataISO;
    return ((diferencaDias(base, dataISO) % n) + n) % n === 0;
  }
  if (Array.isArray(r.diasSemana) && r.diasSemana.length && r.diasSemana.length < 7) {
    return r.diasSemana.includes(diaSemana);
  }
  return true;
}

/** Devolve as horas ('HH:MM') deste medicamento no dia indicado, ordenadas. */
function horasDoMedicamento(med, dataISO) {
  if (!activoNoDia(med, dataISO)) return [];
  const r = med.regime || {};
  const refeicoesConfig = estado.config.refeicoes;
  let horas = [];

  switch (r.tipo) {
    case 'intervalo': {
      const passo = Math.max(1, Number(r.intervaloHoras) || 8);
      const inicio = minutosDeHora(r.horaInicio || '08:00');
      for (let m = inicio; m < inicio + 1440; m += passo * 60) horas.push(horaDeMinutos(m));
      break;
    }
    case 'refeicoes': {
      const desvio = Number(r.desvioMin) || 0;
      (r.refeicoes || []).forEach((idRefeicao) => {
        const base = refeicoesConfig[idRefeicao];
        if (base) horas.push(horaDeMinutos(minutosDeHora(base) + desvio));
      });
      break;
    }
    case 'semanal':
    case 'ciclo':
    case 'horas':
    default:
      horas = [...(r.horas || [])];
      break;
  }

  return [...new Set(horas)].sort((a, b) => minutosDeHora(a) - minutosDeHora(b));
}

/** Descrição legível da posologia, para listagens e impressões. */
function descreverRegime(med) {
  const r = med.regime || {};
  switch (r.tipo) {
    case 'intervalo':
      return `De ${r.intervaloHoras} em ${r.intervaloHoras} horas, a começar às ${r.horaInicio}`;
    case 'refeicoes': {
      const nomes = (r.refeicoes || [])
        .map((id) => REFEICOES.find((x) => x.id === id)?.rotulo.toLowerCase())
        .filter(Boolean);
      const d = Number(r.desvioMin) || 0;
      const quando = d === 0 ? 'À hora d' : d < 0 ? `${Math.abs(d)} min antes d` : `${d} min depois d`;
      const lista = nomes.length > 1
        ? nomes.slice(0, -1).join(', ') + ' e ' + nomes.slice(-1)
        : (nomes[0] || '—');
      return `${quando}o ${lista}`;
    }
    case 'semanal': {
      const dias = (r.diasSemana || []).map((d) => ['domingo', 'segunda', 'terça', 'quarta',
        'quinta', 'sexta', 'sábado'][d]);
      return `${(r.horas || []).join(', ')} — ${dias.join(', ') || 'sem dias definidos'}`;
    }
    case 'ciclo':
      return `${(r.horas || []).join(', ')} — de ${r.cadaNDias} em ${r.cadaNDias} dias`;
    case 'sos':
      return 'Apenas em caso de necessidade (SOS)';
    default:
      return (r.horas || []).join(', ') || '—';
  }
}

function rotuloForma(id) {
  return FORMAS.find((f) => f.id === id)?.rotulo || 'Comprimido';
}

function instrucaoCurta(id) {
  return INSTRUCOES.find((i) => i.id === id)?.curta || '';
}

/* -------------------------------------------------------------------------
   Tomas do dia e agrupamento em blocos
   ------------------------------------------------------------------------- */

/** Lista plana de tomas do dia: uma entrada por medicamento e hora. */
function tomasDoDia(dataISO) {
  const tomas = [];
  estado.medicamentos.forEach((med) => {
    horasDoMedicamento(med, dataISO).forEach((hora) => {
      const registo = obterRegisto(dataISO, med.id, hora);
      tomas.push({
        med,
        hora,
        minutos: minutosDeHora(hora),
        estado: registo?.estado || 'pendente',
        confirmadoEm: registo?.hora || null,
      });
    });
  });
  return tomas.sort((a, b) => a.minutos - b.minutos || a.med.nome.localeCompare(b.med.nome, 'pt'));
}

function periodoDe(minutos) {
  if (minutos < 11 * 60) return 'manha';
  if (minutos < 15 * 60) return 'meio';
  if (minutos < 19 * 60) return 'tarde';
  return 'noite';
}

/** Nome amigável para um bloco, ancorado nas refeições configuradas. */
function nomearBloco(minutos) {
  const refeicoes = estado.config.refeicoes;
  let melhor = null;
  REFEICOES.forEach(({ id, rotulo }) => {
    const base = refeicoes[id];
    if (!base) return;
    const distancia = minutos - minutosDeHora(base);
    if (Math.abs(distancia) <= 40 && (!melhor || Math.abs(distancia) < Math.abs(melhor.distancia))) {
      melhor = { rotulo, distancia, id };
    }
  });
  if (!melhor) {
    const p = periodoDe(minutos);
    return { titulo: p === 'manha' ? 'De manhã' : p === 'meio' ? 'A meio do dia'
                     : p === 'tarde' ? 'Da parte da tarde' : 'À noite', ancora: null };
  }
  if (melhor.id === 'deitar') return { titulo: 'Ao deitar', ancora: 'deitar' };
  const d = Math.round(melhor.distancia);
  if (d <= -10) return { titulo: `${Math.abs(d)} min antes do ${melhor.rotulo.toLowerCase()}`, ancora: melhor.id };
  if (d >= 10) return { titulo: `${d} min depois do ${melhor.rotulo.toLowerCase()}`, ancora: melhor.id };
  return { titulo: `Ao ${melhor.rotulo.toLowerCase()}`, ancora: melhor.id };
}

/**
 * Agrupa as tomas em blocos: tomas com horas próximas (dentro da janela
 * configurada) passam a ser um único momento. É isto que reduz vinte avisos
 * soltos a cinco ou seis momentos claros no dia.
 */
function blocosDoDia(dataISO) {
  const tomas = tomasDoDia(dataISO);
  const janela = Math.max(0, Number(estado.config.janelaAgrupamentoMin) || 0);
  const blocos = [];

  tomas.forEach((toma) => {
    const ultimo = blocos[blocos.length - 1];
    if (ultimo && toma.minutos - ultimo.minutos <= janela) {
      ultimo.tomas.push(toma);
    } else {
      blocos.push({ minutos: toma.minutos, hora: toma.hora, tomas: [toma] });
    }
  });

  return blocos.map((bloco) => {
    const nome = nomearBloco(bloco.minutos);
    const pendentes = bloco.tomas.filter((t) => t.estado === 'pendente');
    const tomadas = bloco.tomas.filter((t) => t.estado === 'tomada');
    const saltadas = bloco.tomas.filter((t) => t.estado === 'saltada');
    return {
      ...bloco,
      id: `${dataISO}#${bloco.hora}`,
      periodo: periodoDe(bloco.minutos),
      titulo: nome.titulo,
      ancora: nome.ancora,
      pendentes, tomadas, saltadas,
      concluido: pendentes.length === 0,
    };
  });
}

/* -------------------------------------------------------------------------
   Situação de cada bloco face à hora actual
   ------------------------------------------------------------------------- */

function situacaoDoBloco(bloco, dataISO) {
  const hojeISO = paraISO(new Date());
  if (bloco.concluido) return 'concluido';
  if (dataISO > hojeISO) return 'futuro';
  if (dataISO < hojeISO) return 'atrasado';
  const agora = minutosAgora();
  const tolerancia = Number(estado.config.toleranciaAtrasoMin) || 60;
  if (agora < bloco.minutos - 30) return 'futuro';
  if (agora <= bloco.minutos + tolerancia) return 'agora';
  return 'atrasado';
}

/* -------------------------------------------------------------------------
   Conflitos e avisos de segurança (organização, não aconselhamento clínico)
   ------------------------------------------------------------------------- */

function avisosDoBloco(bloco) {
  const avisos = [];
  const jejum = bloco.tomas.filter((t) => t.med.instrucoes === 'jejum');
  const comComida = bloco.tomas.filter((t) => t.med.instrucoes === 'durante' || t.med.instrucoes === 'depois');
  if (jejum.length && comComida.length) {
    avisos.push('Este momento junta medicamentos em jejum com outros que pedem comida. '
      + 'Confirme com o médico ou farmacêutico se podem ficar à mesma hora.');
  }
  return avisos;
}

/* -------------------------------------------------------------------------
   Stock
   ------------------------------------------------------------------------- */

/** Unidades consumidas por dia, em média (usa os próximos 28 dias). */
function consumoDiario(med) {
  const hoje = new Date();
  let total = 0;
  for (let i = 0; i < 28; i += 1) {
    const d = new Date(hoje); d.setDate(d.getDate() + i);
    total += horasDoMedicamento(med, paraISO(d)).length * (Number(med.quantidadePorToma) || 0);
  }
  return total / 28;
}

function diasDeStock(med) {
  const unidades = med.stock?.unidades;
  if (typeof unidades !== 'number' || Number.isNaN(unidades)) return null;
  const consumo = consumoDiario(med);
  if (consumo <= 0) return null;
  return Math.floor(unidades / consumo);
}

function alertasDeStock() {
  const limite = Number(estado.config.avisoStockDias) || 7;
  return estado.medicamentos
    .filter((m) => m.activo)
    .map((m) => ({ med: m, dias: diasDeStock(m) }))
    .filter((x) => x.dias !== null && x.dias <= limite)
    .sort((a, b) => a.dias - b.dias);
}

/* -------------------------------------------------------------------------
   Adesão
   ------------------------------------------------------------------------- */

function adesaoNoPeriodo(dataInicioISO, dataFimISO) {
  let previstas = 0; let tomadas = 0; let saltadas = 0;
  let iso = dataInicioISO;
  const hoje = paraISO(new Date());
  while (iso <= dataFimISO) {
    tomasDoDia(iso).forEach((t) => {
      // No dia de hoje só contam as tomas cuja hora já passou.
      if (iso === hoje && t.minutos > minutosAgora()) return;
      previstas += 1;
      if (t.estado === 'tomada') tomadas += 1;
      if (t.estado === 'saltada') saltadas += 1;
    });
    const d = deISO(iso); d.setDate(d.getDate() + 1);
    iso = paraISO(d);
  }
  const falhadas = previstas - tomadas - saltadas;
  return {
    previstas, tomadas, saltadas, falhadas,
    percentagem: previstas ? Math.round((tomadas / previstas) * 100) : null,
  };
}

/* -------------------------------------------------------------------------
   Exportação para o calendário do telemóvel (.ics)
   Dá alarmes ao nível do sistema operativo, mesmo com a aplicação fechada.
   ------------------------------------------------------------------------- */

function escaparICS(texto) {
  return String(texto).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

function carimboUTC(data) {
  return data.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

function dataLocalICS(iso, hhmm) {
  return `${iso.replace(/-/g, '')}T${hhmm.replace(':', '')}00`;
}

function gerarICS({ dias = 90 } = {}) {
  const agora = new Date();
  const hoje = paraISO(agora);
  const antecedencia = Math.max(0, Number(estado.config.avisoAntecedenciaMin) || 0);
  const linhas = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dose Certa//PT', 'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH', 'X-WR-CALNAME:Dose Certa — medicação',
  ];

  estado.medicamentos.filter((m) => m.activo && m.regime?.tipo !== 'sos').forEach((med) => {
    // Uma série por hora distinta, repetida diariamente (ou nos dias aplicáveis).
    const horasBase = new Set();
    for (let i = 0; i < 14; i += 1) {
      const d = new Date(agora); d.setDate(d.getDate() + i);
      horasDoMedicamento(med, paraISO(d)).forEach((h) => horasBase.add(h));
    }
    const fim = new Date(agora); fim.setDate(fim.getDate() + dias);
    const ate = carimboUTC(fim);

    [...horasBase].sort().forEach((hora, indice) => {
      const r = med.regime || {};
      let regra = `FREQ=DAILY;UNTIL=${ate}`;
      if (r.tipo === 'semanal' && Array.isArray(r.diasSemana) && r.diasSemana.length) {
        const cod = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
        regra = `FREQ=WEEKLY;BYDAY=${r.diasSemana.map((d) => cod[d]).join(',')};UNTIL=${ate}`;
      } else if (r.tipo === 'ciclo') {
        regra = `FREQ=DAILY;INTERVAL=${Math.max(1, Number(r.cadaNDias) || 1)};UNTIL=${ate}`;
      }
      const inicio = med.inicio && med.inicio > hoje ? med.inicio : hoje;
      const titulo = `${med.nome}${med.dosagem ? ' ' + med.dosagem : ''} — ${med.quantidadePorToma} ${rotuloForma(med.forma).toLowerCase()}`;
      const nota = [instrucaoCurta(med.instrucoes), med.naCaixaSemanal ? 'Está na caixa semanal' : 'Retirar da embalagem', med.notas]
        .filter(Boolean).join(' · ');

      linhas.push(
        'BEGIN:VEVENT',
        `UID:${med.id}-${indice}@dose-certa`,
        `DTSTAMP:${carimboUTC(agora)}`,
        `DTSTART:${dataLocalICS(inicio, hora)}`,
        `DURATION:PT10M`,
        `RRULE:${regra}`,
        `SUMMARY:${escaparICS(titulo)}`,
        `DESCRIPTION:${escaparICS(nota)}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY',
        `TRIGGER:-PT${antecedencia}M`,
        `DESCRIPTION:${escaparICS(titulo)}`,
        'END:VALARM',
        'END:VEVENT',
      );
    });
  });

  linhas.push('END:VCALENDAR');
  return linhas.join('\r\n');
}

/* -------------------------------------------------------------------------
   Simplificação do dia
   --------------------------------------------------------------------------
   O problema de origem não é a lista de medicamentos: é o número de momentos
   em que é preciso parar tudo e tomar qualquer coisa. Alguns desses momentos
   são inevitáveis (intervalos rígidos, tomas presas às refeições); outros são
   arbitrários — uma hora escrita à pressa que podia coincidir com um momento
   que já existe.

   Só propomos mover tomas de hora livre e sem restrição alimentar. Nunca
   mexemos em intervalos (8/8h), em tomas ligadas a refeições, nem em nada que
   precise de jejum ou de comida: essas têm razão clínica para estar onde estão.
   ------------------------------------------------------------------------- */

const DISTANCIA_MAXIMA_MIN = 90;

function sugestoesDeSimplificacao(dataISO) {
  const horasFixas = new Set();
  estado.medicamentos.forEach((med) => {
    if (!med.activo) return;
    const tipo = med.regime?.tipo;
    const presoAoHorario = tipo === 'intervalo' || tipo === 'refeicoes';
    const presoAComida = med.instrucoes && med.instrucoes !== 'indiferente';
    if (presoAoHorario || presoAComida) {
      horasDoMedicamento(med, dataISO).forEach((h) => horasFixas.add(h));
    }
  });
  if (!horasFixas.size) return [];

  const ancoras = [...horasFixas].map(minutosDeHora).sort((a, b) => a - b);
  const sugestoes = [];

  estado.medicamentos.forEach((med) => {
    if (!med.activo) return;
    if (med.regime?.tipo !== 'horas') return;              // hora livre
    if (med.instrucoes && med.instrucoes !== 'indiferente') return;  // sem restrição alimentar

    (med.regime.horas || []).forEach((hora, indice) => {
      if (horasFixas.has(hora)) return;                    // já coincide
      const minutos = minutosDeHora(hora);
      let melhor = null;
      ancoras.forEach((ancora) => {
        const distancia = Math.abs(ancora - minutos);
        if (distancia === 0 || distancia > DISTANCIA_MAXIMA_MIN) return;
        if (melhor === null || distancia < Math.abs(melhor - minutos)) melhor = ancora;
      });
      if (melhor === null) return;
      sugestoes.push({ med, indice, de: hora, para: horaDeMinutos(melhor) });
    });
  });

  return sugestoes;
}

function aplicarSimplificacao(sugestoes) {
  sugestoes.forEach(({ med, indice, para }) => { med.regime.horas[indice] = para; });
  // Duas horas do mesmo medicamento podem ter caído no mesmo momento.
  new Set(sugestoes.map((s) => s.med)).forEach((med) => {
    med.regime.horas = [...new Set(med.regime.horas)].sort((a, b) => minutosDeHora(a) - minutosDeHora(b));
  });
  guardar();
}

/* ===== js/avisos.js ===== */
/* ==========================================================================
   avisos.js — lembretes: notificação do sistema, voz, som e alarme no ecrã
   --------------------------------------------------------------------------
   Limitação honesta: sem servidor, um site só consegue avisar enquanto está
   aberto (mesmo que em segundo plano). Para alarmes garantidos com a app
   fechada, exportamos as tomas para o calendário do telemóvel (ver .ics).
   ========================================================================== */




let temporizador = null;
let ultimoAvisado = null;      // 'AAAA-MM-DD#HH:MM' do último bloco anunciado
const jaAvisados = new Set();
let aoTocar = () => {};

function definirCallbackAlarme(fn) { aoTocar = fn; }

/* -------------------------------------------------------------------------
   Permissão
   ------------------------------------------------------------------------- */

function estadoPermissao() {
  if (!('Notification' in window)) return 'indisponivel';
  return Notification.permission;    // 'default' | 'granted' | 'denied'
}

// A partir de file:// o Chrome devolve 'denied' sem sequer mostrar a caixa de
// autorização, e deixa Notification.permission em 'default'. Sem isto, a app
// ficava a dizer «ainda não autorizou» e o botão parecia não fazer nada.
let recusadoPelaOrigem = false;

async function pedirPermissao() {
  if (!('Notification' in window)) return 'indisponivel';
  try {
    const resposta = await Notification.requestPermission();
    if (resposta === 'denied' && Notification.permission === 'default') {
      recusadoPelaOrigem = true;     // recusa do navegador, não da pessoa
    }
    return resposta;
  } catch {
    recusadoPelaOrigem = true;
    return Notification.permission;
  }
}

/* -------------------------------------------------------------------------
   Diagnóstico — porque é que os avisos não aparecem?
   --------------------------------------------------------------------------
   Falhar em silêncio é o pior que esta aplicação pode fazer: quem conta com
   ela para tomar a medicação não tem como perceber que não vai ser avisado.
   Esta função diz sempre o que se passa e o que fazer a seguir.
   ------------------------------------------------------------------------- */

async function diagnostico() {
  if (!('Notification' in window)) {
    return { podeAvisar: false, motivo: 'sem-suporte',
      titulo: 'Este navegador não sabe mostrar avisos',
      explicacao: 'Experimente o Chrome, o Edge, o Firefox ou o Safari numa versão recente.',
      accao: null };
  }

  if (location.protocol === 'file:') {
    return { podeAvisar: false, motivo: 'ficheiro',
      titulo: 'Os avisos não funcionam a partir do ficheiro',
      explicacao: 'Está a abrir a aplicação directamente do computador. Nesta situação o '
        + 'navegador recusa os avisos sem sequer perguntar — não é nada que tenha feito mal. '
        + 'Para ter lembretes, coloque a aplicação num endereço que comece por https:// '
        + 'e abra-a por aí.',
      accao: 'calendario' };
  }

  if (!window.isSecureContext) {
    return { podeAvisar: false, motivo: 'inseguro',
      titulo: 'Este endereço não permite avisos',
      explicacao: `Está a abrir a aplicação por ${location.protocol}//. Os navegadores só `
        + 'deixam avisar em endereços seguros, começados por https:// (ou em localhost, '
        + 'durante testes).',
      accao: 'calendario' };
  }

  if (recusadoPelaOrigem) {
    return { podeAvisar: false, motivo: 'recusado-pelo-navegador',
      titulo: 'O navegador recusou os avisos',
      explicacao: 'O pedido de autorização foi recusado sem chegar a aparecer. Costuma '
        + 'acontecer quando a página não está num endereço https:// ou quando os avisos '
        + 'estão desligados nas definições do navegador.',
      accao: 'calendario' };
  }

  if (Notification.permission === 'denied') {
    return { podeAvisar: false, motivo: 'bloqueado',
      titulo: 'Os avisos estão bloqueados para este site',
      explicacao: 'Toque no cadeado ao lado do endereço, procure «Notificações» e escolha '
        + '«Permitir». Depois volte aqui e faça o teste.',
      accao: 'calendario' };
  }

  if (Notification.permission === 'default') {
    return { podeAvisar: false, motivo: 'por-autorizar',
      titulo: 'Ainda não autorizou os avisos',
      explicacao: 'Sem essa autorização a aplicação não o pode chamar à hora certa.',
      accao: 'autorizar' };
  }

  // Autorizado. No telemóvel, mostrar avisos exige um service worker registado.
  let registo = null;
  try { registo = (await navigator.serviceWorker?.getRegistration()) || null; } catch { /* */ }
  const noTelemovel = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!registo && noTelemovel) {
    return { podeAvisar: false, motivo: 'sem-service-worker',
      titulo: 'Falta um pedaço da aplicação para avisar no telemóvel',
      explicacao: 'Os avisos em telemóvel precisam da aplicação instalada a partir de um '
        + 'endereço https://. Recarregue a página; se continuar assim, adicione a aplicação '
        + 'ao ecrã principal e volte a abrir por aí.',
      accao: 'calendario' };
  }

  return { podeAvisar: true, motivo: 'ok',
    titulo: 'Os avisos estão a funcionar neste dispositivo',
    explicacao: 'Faça o teste abaixo para confirmar que ouve e vê o lembrete.',
    accao: 'testar' };
}

/* -------------------------------------------------------------------------
   Canais de aviso
   ------------------------------------------------------------------------- */

/**
 * Mostra uma notificação do sistema. Devolve `true` se alguma via resultou.
 * Nunca engole a falha em silêncio: quem depende disto para tomar medicação
 * precisa de saber quando o aviso não chegou.
 */
async function mostrarNotificacao(titulo, corpo, etiqueta) {
  if (estadoPermissao() !== 'granted') return false;
  const opcoes = {
    body: corpo,
    tag: etiqueta,
    renotify: true,
    requireInteraction: true,
    icon: 'assets/icone.svg',
    badge: 'assets/icone.svg',
    lang: 'pt-PT',
  };

  // No telemóvel só a via do service worker resulta: o construtor Notification
  // lança «Illegal constructor» no Chrome para Android.
  try {
    const registo = await navigator.serviceWorker?.getRegistration();
    if (registo) { await registo.showNotification(titulo, opcoes); return true; }
  } catch (erro) {
    console.warn('Aviso pelo service worker falhou', erro);
  }

  try { new Notification(titulo, opcoes); return true; }
  catch (erro) {
    console.warn('Aviso pelo construtor falhou', erro);
    return false;
  }
}

let contexto = null;

function tocarSom() {
  if (!estado.config.som) return;
  try {
    contexto = contexto || new (window.AudioContext || window.webkitAudioContext)();
    if (contexto.state === 'suspended') contexto.resume();
    const agora = contexto.currentTime;
    [0, 0.42, 0.84].forEach((atraso) => {
      const osc = contexto.createOscillator();
      const ganho = contexto.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(784, agora + atraso);
      osc.frequency.setValueAtTime(1046, agora + atraso + 0.16);
      ganho.gain.setValueAtTime(0.0001, agora + atraso);
      ganho.gain.exponentialRampToValueAtTime(0.28, agora + atraso + 0.03);
      ganho.gain.exponentialRampToValueAtTime(0.0001, agora + atraso + 0.34);
      osc.connect(ganho); ganho.connect(contexto.destination);
      osc.start(agora + atraso); osc.stop(agora + atraso + 0.36);
    });
  } catch { /* som é acessório */ }
}

function falar(texto) {
  if (!estado.config.voz || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = 'pt-PT';
    fala.rate = 0.92;
    fala.pitch = 1;
    const voz = speechSynthesis.getVoices().find((v) => v.lang === 'pt-PT')
             || speechSynthesis.getVoices().find((v) => v.lang?.startsWith('pt'));
    if (voz) fala.voice = voz;
    speechSynthesis.speak(fala);
  } catch { /* voz é acessória */ }
}

// Os navegadores recusam vibrar antes de a pessoa tocar no ecrã, e queixam-se
// na consola. Só tentamos depois da primeira interação.
let houveInteracao = false;
['pointerdown', 'keydown'].forEach((evento) => {
  window.addEventListener(evento, () => { houveInteracao = true; }, { once: true, passive: true });
});

function vibrar() {
  if (!houveInteracao) return;
  try { navigator.vibrate?.([300, 150, 300, 150, 500]); } catch { /* ignorado */ }
}

/* -------------------------------------------------------------------------
   Vigia — corre de minuto a minuto enquanto a app está aberta
   ------------------------------------------------------------------------- */

function resumoDoBloco(bloco) {
  return bloco.pendentes
    .map((t) => `${t.med.nome}${t.med.dosagem ? ' ' + t.med.dosagem : ''}`)
    .join(', ');
}

function verificar() {
  const hoje = paraISO(new Date());
  const agora = new Date();
  const minutosAgora = agora.getHours() * 60 + agora.getMinutes();
  const antecedencia = Number(estado.config.avisoAntecedenciaMin) || 0;
  const tolerancia = Number(estado.config.toleranciaAtrasoMin) || 60;

  blocosDoDia(hoje).forEach((bloco) => {
    if (bloco.concluido) return;
    const chave = `${hoje}#${bloco.hora}`;
    if (jaAvisados.has(chave)) return;
    const inicioAviso = bloco.minutos - antecedencia;
    if (minutosAgora < inicioAviso) return;
    if (minutosAgora > bloco.minutos + tolerancia) return;   // já passou a janela

    jaAvisados.add(chave);
    ultimoAvisado = chave;

    const quantos = bloco.pendentes.length;
    const titulo = `${bloco.hora} — ${bloco.titulo}`;
    const corpo = `${quantos} ${quantos === 1 ? 'medicamento' : 'medicamentos'}: ${resumoDoBloco(bloco)}`;

    mostrarNotificacao(titulo, corpo, chave);
    tocarSom();
    vibrar();
    falar(`São ${bloco.hora.replace(':', ' e ')}. Hora de tomar ${quantos} ${quantos === 1 ? 'medicamento' : 'medicamentos'}.`);
    aoTocar(bloco);
  });
}

function iniciarVigia() {
  pararVigia();
  verificar();
  temporizador = setInterval(verificar, 30000);
  document.addEventListener('visibilitychange', aoVoltar);
}

function aoVoltar() { if (!document.hidden) verificar(); }

function pararVigia() {
  if (temporizador) clearInterval(temporizador);
  temporizador = null;
  document.removeEventListener('visibilitychange', aoVoltar);
}

/** Permite reanunciar um bloco (por exemplo, depois de "adiar"). */
function reagendar(dataISO, hora, minutosDepois) {
  const chave = `${dataISO}#${hora}`;
  jaAvisados.add(chave);                    // silencia até ao fim do adiamento
  setTimeout(() => { jaAvisados.delete(chave); verificar(); }, minutosDepois * 60000);
}

function esquecerAviso(dataISO, hora) {
  jaAvisados.add(`${dataISO}#${hora}`);
}

function ultimoBlocoAvisado() { return ultimoAvisado; }

/**
 * Experimenta todos os canais e diz o que resultou, para a pessoa poder
 * confirmar que vai mesmo ser avisada.
 */
async function testarAviso() {
  if (estadoPermissao() === 'default') await pedirPermissao();
  const notificou = await mostrarNotificacao(
    'Dose Certa — teste', 'É assim que vai receber os lembretes.', 'teste');
  tocarSom();
  vibrar();
  falar('Este é um aviso de teste da Dose Certa.');

}

   formulario.js — criar e editar um medicamento
   A posologia é escolhida em linguagem corrente; as horas são calculadas.

const MODELOS = [
  { id: 'x1', rotulo: '1 vez por dia', nota: 'Uma hora fixa',
    aplicar: (r) => { r.tipo = 'horas'; r.horas = ['09:00']; } },
  { id: 'x2', rotulo: '2 vezes por dia', nota: 'Manhã e noite',
    aplicar: (r) => { r.tipo = 'horas'; r.horas = ['09:00', '21:00']; } },
  { id: 'x3', rotulo: '3 vezes por dia', nota: 'Às refeições principais',
    aplicar: (r) => { r.tipo = 'refeicoes'; r.refeicoes = ['pequenoAlmoco', 'almoco', 'jantar']; r.desvioMin = 0; } },
  { id: 'i8', rotulo: 'De 8 em 8 horas', nota: 'Intervalo certo, dia e noite',
    aplicar: (r) => { r.tipo = 'intervalo'; r.intervaloHoras = 8; r.horaInicio = '07:00'; } },
  { id: 'i12', rotulo: 'De 12 em 12 horas', nota: 'Duas tomas espaçadas',
    aplicar: (r) => { r.tipo = 'intervalo'; r.intervaloHoras = 12; r.horaInicio = '09:00'; } },
  { id: 'a30', rotulo: '30 min antes das refeições', nota: 'Antes das 3 principais',
    aplicar: (r) => { r.tipo = 'refeicoes'; r.refeicoes = ['pequenoAlmoco', 'almoco', 'jantar']; r.desvioMin = -30; } },
  { id: 'deitar', rotulo: 'Ao deitar', nota: 'Uma toma à noite',
    aplicar: (r) => { r.tipo = 'refeicoes'; r.refeicoes = ['deitar']; r.desvioMin = 0; } },
  { id: 'semanal', rotulo: 'Só em certos dias', nota: 'Ex.: às segundas e quintas',
    aplicar: (r) => { r.tipo = 'semanal'; r.horas = ['09:00']; r.diasSemana = [1, 4]; } },
  { id: 'sos', rotulo: 'Só em caso de necessidade', nota: 'SOS, sem hora marcada',
    aplicar: (r) => { r.tipo = 'sos'; r.horas = []; } },
];

function modeloActual(regime) {
  const r = regime || {};
  if (r.tipo === 'sos') return 'sos';
  if (r.tipo === 'semanal') return 'semanal';
  if (r.tipo === 'intervalo') return r.intervaloHoras === 12 ? 'i12' : 'i8';
  if (r.tipo === 'refeicoes') {
    if ((r.refeicoes || []).length === 1 && r.refeicoes[0] === 'deitar') return 'deitar';
    return Number(r.desvioMin) === -30 ? 'a30' : 'x3';
  }
  return (r.horas || []).length >= 2 ? 'x2' : 'x1';
}

/** Pré-visualização: as horas concretas que este regime vai gerar. */
function calcularPrevia(regime) {
  const refeicoes = estado.config.refeicoes;
  let horas = [];
  if (regime.tipo === 'intervalo') {
    const passo = Math.max(1, Number(regime.intervaloHoras) || 8);
    const inicio = minutosDeHora(regime.horaInicio || '08:00');
    for (let m = inicio; m < inicio + 1440; m += passo * 60) horas.push(horaDeMinutos(m));
  } else if (regime.tipo === 'refeicoes') {
    (regime.refeicoes || []).forEach((id) => {
      if (refeicoes[id]) horas.push(horaDeMinutos(minutosDeHora(refeicoes[id]) + (Number(regime.desvioMin) || 0)));
    });
  } else if (regime.tipo !== 'sos') {
    horas = [...(regime.horas || [])];
  }
  return [...new Set(horas)].sort((a, b) => minutosDeHora(a) - minutosDeHora(b));
}

function abrirFormulario(id, aoGravar) {
  const original = id ? obterMedicamento(id) : null;
  const med = original ? JSON.parse(JSON.stringify(original)) : medicamentoVazio();
  med.regime = { ...medicamentoVazio().regime, ...(med.regime || {}) };

  const corpo = el('form', { id: 'form-med', novalidate: true });
  const previa = el('p', { classe: 'campo__ajuda', 'aria-live': 'polite' });
  const zonaDetalhe = el('div');

  /* --- identificação --------------------------------------------------- */

  const campoNome = el('input', { type: 'text', id: 'f-nome', value: med.nome,
    required: true, autocomplete: 'off', placeholder: 'Ex.: Synjardy' });
  const campoDosagem = el('input', { type: 'text', id: 'f-dosagem', value: med.dosagem,
    placeholder: 'Ex.: 5 mg/1000 mg' });
  const campoForma = el('select', { id: 'f-forma' },
    FORMAS.map((f) => el('option', { value: f.id, texto: f.rotulo, selected: f.id === med.forma })));
  const campoQuantidade = el('input', { type: 'number', id: 'f-qtd', min: '0.25', step: '0.25',
    value: String(med.quantidadePorToma) });

  corpo.append(
    el('div', { classe: 'campo' }, [
      el('label', { for: 'f-nome', texto: 'Nome do medicamento' }), campoNome,
      el('p', { classe: 'campo__ajuda', texto: 'Escreva como está escrito na caixa.' }),
    ]),
    el('div', { classe: 'linha-2' }, [
      el('div', { classe: 'campo' }, [el('label', { for: 'f-dosagem', texto: 'Dosagem' }), campoDosagem]),
      el('div', { classe: 'campo' }, [el('label', { for: 'f-forma', texto: 'Forma' }), campoForma]),
    ]),
    el('div', { classe: 'campo' }, [
      el('label', { for: 'f-qtd', texto: 'Quantidade em cada toma' }), campoQuantidade,
      el('p', { classe: 'campo__ajuda', texto: 'Ex.: 1 comprimido, 0.5 se for meio comprimido.' }),
    ]),
  );

  /* --- posologia -------------------------------------------------------- */

  const opcoesModelo = el('div', { classe: 'opcoes' });
  MODELOS.forEach((modelo) => {
    const radio = el('input', { type: 'radio', name: 'modelo', value: modelo.id,
      checked: modeloActual(med.regime) === modelo.id,
      ao: { change: () => { modelo.aplicar(med.regime); desenharDetalhe(); } } });
    opcoesModelo.append(el('label', { classe: 'opcao' }, [
      radio,
      el('span', { classe: 'opcao__texto' }, [modelo.rotulo, el('span', { classe: 'opcao__nota', texto: modelo.nota })]),
    ]));
  });

  corpo.append(el('fieldset', {}, [
    el('legend', { texto: 'Quando é que se toma?' }), opcoesModelo, zonaDetalhe, previa,
  ]));

  function desenharDetalhe() {
    zonaDetalhe.replaceChildren();
    const r = med.regime;

    if (r.tipo === 'intervalo') {
      const intervalo = el('select', { id: 'f-intervalo' },
        [4, 6, 8, 12, 24].map((h) => el('option', { value: String(h), texto: `De ${h} em ${h} horas`,
          selected: Number(r.intervaloHoras) === h })));
      intervalo.addEventListener('change', () => { r.intervaloHoras = Number(intervalo.value); actualizarPrevia(); });
      const inicio = el('input', { type: 'time', id: 'f-inicio-hora', value: r.horaInicio || '08:00' });
      inicio.addEventListener('change', () => { r.horaInicio = inicio.value; actualizarPrevia(); });
      zonaDetalhe.append(el('div', { classe: 'linha-2', style: 'margin-top:.8rem' }, [
        el('div', { classe: 'campo' }, [el('label', { for: 'f-intervalo', texto: 'Intervalo' }), intervalo]),
        el('div', { classe: 'campo' }, [el('label', { for: 'f-inicio-hora', texto: 'Primeira toma do dia' }), inicio]),
      ]));
    }

    if (r.tipo === 'refeicoes') {
      const escolhas = el('div', { classe: 'opcoes' });
      REFEICOES.forEach((refeicao) => {
        const caixa = el('input', { type: 'checkbox', checked: (r.refeicoes || []).includes(refeicao.id) });
        caixa.addEventListener('change', () => {
          const conjunto = new Set(r.refeicoes || []);
          if (caixa.checked) conjunto.add(refeicao.id); else conjunto.delete(refeicao.id);
          r.refeicoes = [...conjunto];
          actualizarPrevia();
        });
        escolhas.append(el('label', { classe: 'opcao' }, [
          caixa,
          el('span', { classe: 'opcao__texto' }, [refeicao.rotulo,
            el('span', { classe: 'opcao__nota', texto: `às ${estado.config.refeicoes[refeicao.id]}` })]),
        ]));
      });
      const desvio = el('select', { id: 'f-desvio' }, [
        { v: -60, t: '1 hora antes' }, { v: -30, t: '30 minutos antes' },
        { v: -15, t: '15 minutos antes' }, { v: 0, t: 'À hora da refeição' },
        { v: 15, t: '15 minutos depois' }, { v: 30, t: '30 minutos depois' },
      ].map((o) => el('option', { value: String(o.v), texto: o.t, selected: Number(r.desvioMin) === o.v })));
      desvio.addEventListener('change', () => { r.desvioMin = Number(desvio.value); actualizarPrevia(); });
      zonaDetalhe.append(
        el('div', { classe: 'campo', style: 'margin-top:.8rem' }, [
          el('span', { classe: 'grupo__legenda', texto: 'Em que refeições?' }), escolhas]),
        el('div', { classe: 'campo' }, [el('label', { for: 'f-desvio', texto: 'A que distância da refeição?' }), desvio]),
      );
    }

    if (r.tipo === 'horas' || r.tipo === 'semanal') {
      const lista = el('div', { classe: 'horas-lista' });
      const redesenharHoras = () => {
        lista.replaceChildren();
        (r.horas || []).forEach((hora, indice) => {
          const campo = el('input', { type: 'time', value: hora, 'aria-label': `Hora ${indice + 1}` });
          campo.addEventListener('change', () => { r.horas[indice] = campo.value; actualizarPrevia(); });
          const apagar = el('button', { type: 'button', classe: 'btn btn--neutro btn--pequeno',
            'aria-label': `Remover a hora ${hora}`, ao: { click: () => {
              r.horas.splice(indice, 1); redesenharHoras(); actualizarPrevia();
            } } }, [icone('cruz', '1rem')]);
          lista.append(el('span', { style: 'display:inline-flex;gap:.3rem;align-items:center' }, [campo, apagar]));
        });
        lista.append(el('button', { type: 'button', classe: 'btn btn--neutro btn--pequeno',
          ao: { click: () => { r.horas = [...(r.horas || []), '12:00']; redesenharHoras(); actualizarPrevia(); } } },
          [icone('mais', '1rem'), 'Juntar hora']));
      };
      redesenharHoras();
      zonaDetalhe.append(el('div', { classe: 'campo', style: 'margin-top:.8rem' }, [
        el('span', { classe: 'grupo__legenda', texto: 'A que horas?' }), lista]));
    }

    if (r.tipo === 'semanal') {
      const dias = el('div', { classe: 'dias' });
      DIAS_CURTOS.forEach((rotulo, indice) => {
        const botao = el('button', { type: 'button', classe: 'dia', texto: rotulo,
          'aria-pressed': String((r.diasSemana || []).includes(indice)),
          'aria-label': rotulo });
        botao.addEventListener('click', () => {
          const conjunto = new Set(r.diasSemana || []);
          if (conjunto.has(indice)) conjunto.delete(indice); else conjunto.add(indice);
          r.diasSemana = [...conjunto].sort();
          botao.setAttribute('aria-pressed', String(conjunto.has(indice)));
        });
        dias.append(botao);
      });
      zonaDetalhe.append(el('div', { classe: 'campo' }, [
        el('span', { classe: 'grupo__legenda', texto: 'Em que dias da semana?' }), dias]));
    }

    actualizarPrevia();
  }

  function actualizarPrevia() {
    const horas = calcularPrevia(med.regime);
    previa.textContent = med.regime.tipo === 'sos'
      ? 'Não entra na rotina diária. Fica disponível para registar quando for preciso.'
      : horas.length
        ? `Vai aparecer às: ${horas.join(', ')} (${horas.length} ${horas.length === 1 ? 'toma' : 'tomas'} por dia)`
        : 'Ainda não escolheu horas.';
  }

  /* --- instruções e organização ---------------------------------------- */

  const campoInstrucoes = el('select', { id: 'f-instrucoes' },
    INSTRUCOES.map((i) => el('option', { value: i.id, texto: i.rotulo, selected: i.id === med.instrucoes })));

  const campoCaixa = el('input', { type: 'checkbox', id: 'f-caixa', checked: med.naCaixaSemanal });

  corpo.append(
    el('div', { classe: 'campo' }, [
      el('label', { for: 'f-instrucoes', texto: 'Relação com as refeições' }), campoInstrucoes]),
    el('div', { classe: 'campo' }, [
      el('label', { classe: 'opcao' }, [campoCaixa,
        el('span', { classe: 'opcao__texto' }, ['Este fica preparado na caixa semanal',
          el('span', { classe: 'opcao__nota',
            texto: 'A app avisa que já está no compartimento do dia, em vez de mandar ir à embalagem.' })])]),
    ]),
  );

  /* --- stock ------------------------------------------------------------ */

  const campoStock = el('input', { type: 'number', id: 'f-stock', min: '0', step: '1',
    value: med.stock?.unidades ?? '', placeholder: 'Ex.: 60' });
  const campoAlerta = el('input', { type: 'number', id: 'f-alerta', min: '0', step: '1',
    value: med.stock?.alertaUnidades ?? '', placeholder: 'Ex.: 10' });

  corpo.append(el('fieldset', {}, [
    el('legend', { texto: 'Quantas unidades tem em casa? (opcional)' }),
    el('div', { classe: 'linha-2' }, [
      el('div', { classe: 'campo' }, [el('label', { for: 'f-stock', texto: 'Unidades disponíveis' }), campoStock]),
      el('div', { classe: 'campo' }, [el('label', { for: 'f-alerta', texto: 'Avisar quando restarem' }), campoAlerta]),
    ]),
    el('p', { classe: 'campo__ajuda',
      texto: 'A app desconta a cada toma confirmada e avisa a tempo de aviar a receita.' }),
  ]));

  /* --- período e notas --------------------------------------------------- */

  const campoInicio = el('input', { type: 'date', id: 'f-inicio', value: med.inicio || hojeISO() });
  const campoFim = el('input', { type: 'date', id: 'f-fim', value: med.fim || '' });
  const campoMotivo = el('input', { type: 'text', id: 'f-motivo', value: med.motivo,
    placeholder: 'Ex.: diabetes, tensão arterial' });
  const campoMedico = el('input', { type: 'text', id: 'f-medico', value: med.medico,
    placeholder: 'Ex.: Dr.ª Helena Sousa' });
  const campoNotas = el('textarea', { id: 'f-notas', value: med.notas,
    placeholder: 'Ex.: engolir inteiro, com um copo de água cheio' });

  corpo.append(el('fieldset', {}, [
    el('legend', { texto: 'Mais informação (opcional)' }),
    el('div', { classe: 'linha-2' }, [
      el('div', { classe: 'campo' }, [el('label', { for: 'f-inicio', texto: 'Começou em' }), campoInicio]),
      el('div', { classe: 'campo' }, [el('label', { for: 'f-fim', texto: 'Termina em' }), campoFim]),
    ]),
    el('div', { classe: 'campo' }, [el('label', { for: 'f-motivo', texto: 'Para que serve' }), campoMotivo]),
    el('div', { classe: 'campo' }, [el('label', { for: 'f-medico', texto: 'Receitado por' }), campoMedico]),
    el('div', { classe: 'campo' }, [el('label', { for: 'f-notas', texto: 'Notas' }), campoNotas]),
  ]));

  desenharDetalhe();

  /* --- gravar ------------------------------------------------------------ */

  function recolher() {
    med.nome = campoNome.value.trim();
    med.dosagem = campoDosagem.value.trim();
    med.forma = campoForma.value;
    med.quantidadePorToma = Number(campoQuantidade.value) || 1;
    med.instrucoes = campoInstrucoes.value;
    med.naCaixaSemanal = campoCaixa.checked;
    med.stock = {
      unidades: campoStock.value === '' ? null : Number(campoStock.value),
      alertaUnidades: campoAlerta.value === '' ? null : Number(campoAlerta.value),
    };
    med.inicio = campoInicio.value || hojeISO();
    med.fim = campoFim.value || '';
    med.motivo = campoMotivo.value.trim();
    med.medico = campoMedico.value.trim();
    med.notas = campoNotas.value.trim();
    med.activo = med.activo !== false;
  }

  const accoes = [];
  if (original) {
    accoes.push({ rotulo: 'Apagar', classe: 'btn--perigo', aoClicar: async (fechar) => {
      const certeza = await confirmar({
        titulo: 'Apagar medicamento',
        mensagem: `Quer mesmo apagar “${original.nome}”? O histórico de tomas já registado mantém-se.`,
        rotuloConfirmar: 'Apagar', perigo: true,
      });
      if (certeza) { removerMedicamento(original.id); fechar(); avisar('Medicamento apagado.'); aoGravar?.(); }
    } });
  }
  accoes.push({ rotulo: 'Cancelar', classe: 'btn--neutro', aoClicar: (fechar) => fechar() });
  accoes.push({ rotulo: 'Guardar', classe: 'btn--principal', aoClicar: (fechar) => {
    recolher();
    if (!med.nome) { avisar('Falta o nome do medicamento.'); campoNome.focus(); return; }
    if (med.regime.tipo !== 'sos' && calcularPrevia(med.regime).length === 0) {
      avisar('Escolha pelo menos uma hora de toma.'); return;
    }
    gravarMedicamento(med);
    fechar();
    avisar(original ? 'Alterações guardadas.' : `“${med.nome}” foi adicionado.`);
    aoGravar?.();
  } });

  abrirModal({ titulo: original ? 'Editar medicamento' : 'Novo medicamento', corpo, accoes });
  setTimeout(() => campoNome.focus(), 60);
}
